<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Pixel Art</title>
  
  <!-- Estilos e librería de Cropper.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      margin: 0;
    }
    
    .admin-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .btn-admin-toggle {
      background: transparent;
      border: 1px solid #444;
      color: #aaa;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8em;
    }
    .btn-admin-toggle:hover { border-color: #3b82f6; color: #fff; }

    h1 { color: #3b82f6; margin-top: 0; font-size: 1.6rem; }
    
    .card-form {
      display: none;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      text-align: center;
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
    }
    .btn-upload {
      background-color: #359bf0;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    .btn-upload:hover { background-color: #2580d0; }
    #statusMsg { margin-top: 15px; font-size: 0.9em; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin-top: 15px;
      box-sizing: border-box;
    }
    .gallery-card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #2a2a2a;
      box-sizing: border-box;
    }
    .gallery-card img {
      width: 100%;
      height: 140px;
      object-fit: contain;
      background: #000;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .gallery-card img:hover { transform: scale(1.02); }
    .gallery-card h3 {
      font-size: 0.9rem;
      margin: 8px 0;
      word-break: break-word;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
    }
    .btn-action {
      background-color: #262626;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75em;
      font-weight: 500;
      color: #e5e5e5;
      transition: all 0.2s ease;
      border: 1px solid #444;
    }
    .btn-edit { border-color: #3b82f6; }
    .btn-edit:hover { background-color: #3b82f6; color: #ffffff; }
    .btn-crop { border-color: #eab308; }
    .btn-crop:hover { background-color: #eab308; color: #000; }
    .btn-delete { border-color: #ef4444; }
    .btn-delete:hover { background-color: #ef4444; color: #ffffff; }

    /* --- MODAL PANTALLA COMPLETA --- */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 0;
      margin: 0;
    }
    .modal img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      border-radius: 0;
    }
    .modal-caption {
      position: absolute;
      bottom: 25px;
      font-size: 1.1rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 35px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      z-index: 101;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }

    /* --- MODAL EDITOR DE IMAGEN Y PINTADO --- */
    .editor-modal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #121212;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 15px;
    }
    .editor-container {
      position: relative;
      width: 100%;
      height: 45vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .editor-container img {
      max-width: 100%;
      max-height: 100%;
    }
    .paint-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 210;
      touch-action: none;
      display: none;
    }

    .editor-controls {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: center;
    }

    .btn-do-crop {
      background: #eab308;
      color: #000000;
      font-weight: bold;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-do-crop:hover { background: #ca8a04; color: #fff; }

    .color-panel {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: #1e1e1e;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
    }
    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid #fff; border-radius: 50%; }

    .btn-undo {
      background: #2a2a2a;
      color: #ef4444;
      border: 1px solid #ef4444;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-undo:hover { background: #ef4444; color: #fff; }

    .editor-controls label { font-size: 0.8rem; color: #ccc; }
    .editor-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn-editor-save {
      background: #3b82f6;
      border: none;
      color: #ffffff;
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      flex: 1;
      font-size: 0.9rem;
    }
    .btn-editor-save:hover { background: #2563eb; }
    .btn-editor-cancel {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      flex: 1;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="admin-bar">
    <button class="btn-admin-toggle" onclick="toggleAdminMode()" id="adminBtn">🔐 Modo Admin</button>
  </div>

  <h1>Galería de Pixel Art</h1>

  <div class="card-form" id="uploadForm">
    <h2>Subir nuevo dibujo</h2>
    <input type="text" id="nameInput" placeholder="Nombre del personaje / dibujo">
    
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;" onchange="subirImagen()">
    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
      📷 Tomar Foto / Seleccionar
    </button>

    <div id="statusMsg"></div>
  </div>

  <div class="gallery-grid" id="galleryGrid">Cargando galería...</div>

  <!-- Modal Ver Imagen -->
  <div id="imageModal" class="modal" onclick="cerrarModal()">
    <span class="modal-close">&times;</span>
    <img id="modalImg" src="" alt="Imagen ampliada">
    <div id="modalCaption" class="modal-caption"></div>
  </div>

  <!-- Modal Editor de Imagen y Pincel -->
  <div id="editorModal" class="editor-modal">
    <h3 style="margin: 5px 0; font-size: 1.1rem;">Editar Imagen & Tapar Firma</h3>
    <div class="editor-container" id="editorContainer">
      <img id="imageToEdit" src="" alt="Editar">
      <canvas id="paintCanvas" class="paint-canvas"></canvas>
    </div>
    
    <div class="editor-controls">
      <!-- Botón de Acción Recortar -->
      <button class="btn-do-crop" id="btnCrop" onclick="aplicarRecorteManual()">✂️ Recortar Imagen Selección</button>

      <!-- Herramienta de Pincel de Color -->
      <div id="paintTools" class="color-panel" style="display: none;">
        <div class="color-picker-wrapper">
          <label>Color:</label>
          <input type="color" id="brushColor" value="#121212">
        </div>
        <div>
          <label>Grosor:</label>
          <input type="range" id="brushSize" min="5" max="40" value="15" style="width: 80px;">
        </div>
        <button class="btn-undo" onclick="deshacerPintura()">↩️ Deshacer</button>
      </div>

      <div>
        <label>Brillo: <span id="brightnessVal">100%</span></label>
        <input type="range" id="brightnessRange" min="50" max="200" value="100" oninput="ajustarBrillo(this.value)">
      </div>
      
      <div class="editor-btns">
        <button class="btn-editor-cancel" onclick="cerrarEditor()">Cancelar</button>
        <button class="btn-editor-save" id="btnSaveEdit" onclick="guardarEdicion()">Guardar Imagen</button>
      </div>
    </div>
  </div>

  <script>
    const IMGBB_API_KEY = "9fc58ee8b707046ece9681fa65e39604";
    const JSONBIN_BIN_ID = "6a7297f9f5f4af5e29ec52c2";
    const JSONBIN_MASTER_KEY = "$2a$10$vygQg5yM2D./HgSdwYY3FurZQV/dUU5iTNvDzdDmi7eQRyVSaA6Fe";
    const ADMIN_PIN = "1234";

    let isAdmin = false;
    let galeriaActual = [];
    let cropper = null;
    let indiceEnEdicion = -1;
    let valorBrilloActual = 100;

    // Variables de Pincel
    let paintCanvas = null;
    let paintCtx = null;
    let isDrawing = false;
    let historyStack = [];

    // --- MANEJO DE RETROCESO ---
    window.addEventListener("popstate", function (e) {
      const editorModal = document.getElementById('editorModal');
      const imageModal = document.getElementById('imageModal');

      if (editorModal.style.display === "flex") {
        cerrarEditor(false);
      } else if (imageModal.style.display === "flex") {
        cerrarModal(false);
      }
    });

    function agregarEstadoHistorial() {
      history.pushState({ modalOpen: true }, "");
    }

    function optimizarEImagen(file, maxDimension = 1000, quality = 0.85) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function obtenerGaleriaNube() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
        });
        const data = await res.json();
        
        let datos = data.record || [];
        if (Array.isArray(datos)) {
          galeriaActual = datos.filter(item => item.url && !item.url.includes("sample.jpg"));
        } else {
          galeriaActual = [];
        }

        cargarGaleriaUI();
      } catch (err) {
        console.error("Error al obtener datos:", err);
        document.getElementById('galleryGrid').innerText = "Error al cargar la galería.";
      }
    }

    async function guardarGaleriaNube(nuevaGaleria) {
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": JSONBIN_MASTER_KEY
          },
          body: JSON.stringify(nuevaGaleria)
        });
        galeriaActual = nuevaGaleria;
        cargarGaleriaUI();
      } catch (err) {
        console.error("Error al guardar datos:", err);
      }
    }

    function toggleAdminMode() {
      const uploadForm = document.getElementById('uploadForm');
      if (isAdmin) {
        isAdmin = false;
        document.getElementById('adminBtn').innerText = "🔐 Modo Admin";
        uploadForm.style.display = "none";
      } else {
        const pass = prompt("Ingresa la clave de administrador:");
        if (pass === ADMIN_PIN) {
          isAdmin = true;
          document.getElementById('adminBtn').innerText = "🔓 Salir de Modo Admin";
          uploadForm.style.display = "block";
        } else if (pass !== null) {
          alert("Clave incorrecta.");
        }
      }
      cargarGaleriaUI();
    }

    async function subirImagen() {
      if (!isAdmin) return;
      const nameInput = document.getElementById('nameInput');
      const fileInput = document.getElementById('fileInput');
      const statusMsg = document.getElementById('statusMsg');

      if (!fileInput.files[0]) return;

      const title = nameInput.value.trim() || "Sin título";
      const file = fileInput.files[0];

      statusMsg.innerText = "Optimizando y subiendo...";
      statusMsg.style.color = "#3b82f6";

      try {
        const blobOptimizado = await optimizarEImagen(file, 1000, 0.85);

        const formData = new FormData();
        formData.append("image", blobOptimizado, "pixelart.jpg");

        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          const imageUrl = data.data.url;
          const nuevaLista = [{ id: Date.now(), title: title, url: imageUrl }, ...galeriaActual];
          
          await guardarGaleriaNube(nuevaLista);

          nameInput.value = '';
          fileInput.value = '';
          statusMsg.innerText = "¡Imagen guardada ultra rápido!";
          statusMsg.style.color = "#00d26a";
        } else {
          statusMsg.innerText = "Error al subir la imagen.";
          statusMsg.style.color = "#ff4d4d";
        }
      } catch (error) {
        console.error(error);
        statusMsg.innerText = "Error de conexión.";
        statusMsg.style.color = "#ff4d4d";
      }
    }

    function cargarGaleriaUI() {
      const galleryGrid = document.getElementById('galleryGrid');
      galleryGrid.innerHTML = '';

      if (galeriaActual.length === 0) {
        galleryGrid.innerHTML = '<p style="grid-column: 1/-1; color: #888;">No hay imágenes cargadas aún.</p>';
        return;
      }

      galeriaActual.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        
        const actionButtons = isAdmin ? `
          <div class="card-actions">
            <button class="btn-action btn-edit" onclick="editarTitulo(${index})">✏️ Renombrar</button>
            <button class="btn-action btn-crop" onclick="abrirEditor(${index})">✂️ Editar/Tapar Firma</button>
            <button class="btn-action btn-delete" onclick="eliminarImagen(${index})">🗑️ Eliminar</button>
          </div>
        ` : '';

        card.innerHTML = `
          <img src="${item.url}" alt="${item.title}" loading="lazy" onclick="abrirModal('${item.url}', '${item.title}')">
          <h3>${item.title}</h3>
          ${actionButtons}
        `;
        galleryGrid.appendChild(card);
      });
    }

    /* --- EDITOR DE IMAGEN Y HERRAMIENTA DE PINCEL DE COLOR --- */
    function abrirEditor(index) {
      if (!isAdmin) return;
      indiceEnEdicion = index;
      const item = galeriaActual[index];
      
      const imageToEdit = document.getElementById('imageToEdit');
      imageToEdit.src = item.url;
      imageToEdit.crossOrigin = "anonymous";

      document.getElementById('brightnessRange').value = 100;
      document.getElementById('brightnessVal').innerText = "100%";
      document.getElementById('paintTools').style.display = "none";
      document.getElementById('btnCrop').style.display = "block";
      
      const canvas = document.getElementById('paintCanvas');
      canvas.style.display = "none";

      valorBrilloActual = 100;
      historyStack = [];

      document.getElementById('editorModal').style.display = "flex";
      agregarEstadoHistorial();

      if (cropper) { cropper.destroy(); }
      cropper = new Cropper(imageToEdit, {
        viewMode: 1,
        autoCropArea: 0.9,
      });
    }

    // --- APLICAR RECORTE Y ACTIVAR MODO PINCEL ---
    function aplicarRecorteManual() {
      if (!cropper) return;
      const canvasCortado = cropper.getCroppedCanvas();
      if (!canvasCortado) return;

      const imageToEdit = document.getElementById('imageToEdit');
      
      imageToEdit.src = canvasCortado.toDataURL('image/jpeg', 0.95);
      
      cropper.destroy();
      cropper = null;

      document.getElementById('btnCrop').style.display = "none";
      document.getElementById('paintTools').style.display = "flex";

      // Habilitar lienzo transparente encima para pintar
      setTimeout(inicializarLienzoPintura, 100);
    }

    function inicializarLienzoPintura() {
      paintCanvas = document.getElementById('paintCanvas');
      const img = document.getElementById('imageToEdit');

      paintCanvas.width = img.clientWidth;
      paintCanvas.height = img.clientHeight;
      paintCanvas.style.display = "block";

      paintCtx = paintCanvas.getContext('2d');
      paintCtx.lineCap = 'round';
      paintCtx.lineJoin = 'round';

      guardarEstadoPintura();

      // Eventos de dibujo (Mouse y Touch)
      paintCanvas.onpointerdown = empezarDibujo;
      paintCanvas.onpointermove = dibujar;
      paintCanvas.onpointerup = detenerDibujo;
    }

    function empezarDibujo(e) {
      isDrawing = true;
      paintCtx.beginPath();
      const rect = paintCanvas.getBoundingClientRect();
      paintCtx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function dibujar(e) {
      if (!isDrawing) return;
      const rect = paintCanvas.getBoundingClientRect();
      const color = document.getElementById('brushColor').value;
      const size = document.getElementById('brushSize').value;

      paintCtx.strokeStyle = color;
      paintCtx.lineWidth = size;
      paintCtx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      paintCtx.stroke();
    }

    function detenerDibujo() {
      if (isDrawing) {
        paintCtx.closePath();
        isDrawing = false;
        guardarEstadoPintura();
      }
    }

    function guardarEstadoPintura() {
      if (!paintCtx) return;
      historyStack.push(paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height));
    }

    function deshacerPintura() {
      if (historyStack.length > 1) {
        historyStack.pop();
        const prev = historyStack[historyStack.length - 1];
        paintCtx.putImageData(prev, 0, 0);
      }
    }

    function ajustarBrillo(val) {
      valorBrilloActual = val;
      document.getElementById('brightnessVal').innerText = val + "%";
      const img = document.getElementById('imageToEdit');
      if (img) {
        img.style.filter = `brightness(${val}%)`;
      }
      const container = document.querySelector('.cropper-container');
      if (container) {
        container.style.filter = `brightness(${val}%)`;
      }
    }

    function cerrarEditor(backInHistory = true) {
      if (cropper) { cropper.destroy(); cropper = null; }
      document.getElementById('editorModal').style.display = "none";
      indiceEnEdicion = -1;
      if (backInHistory && history.state && history.state.modalOpen) {
        history.back();
      }
    }

    async function guardarEdicion() {
      if (indiceEnEdicion === -1 || !galeriaActual[indiceEnEdicion]) {
        alert("Ocurrió un problema con la imagen a editar.");
        return;
      }

      const btnSave = document.getElementById('btnSaveEdit');
      btnSave.innerText = "Guardando...";
      btnSave.disabled = true;

      try {
        let baseCanvas;

        if (cropper) {
          baseCanvas = cropper.getCroppedCanvas({ maxWidth: 1000, maxHeight: 1000 });
        } else {
          const img = document.getElementById('imageToEdit');
          baseCanvas = document.createElement('canvas');
          baseCanvas.width = img.naturalWidth || img.clientWidth;
          baseCanvas.height = img.naturalHeight || img.clientHeight;
          const ctx = baseCanvas.getContext('2d');
          ctx.drawImage(img, 0, 0, baseCanvas.width, baseCanvas.height);
        }

        if (!baseCanvas) throw new Error("No se obtuvo la imagen.");

        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = baseCanvas.width;
        finalCanvas.height = baseCanvas.height;
        const ctx = finalCanvas.getContext('2d');

        // Aplicar Brillo
        ctx.filter = `brightness(${valorBrilloActual}%)`;
        ctx.drawImage(baseCanvas, 0, 0);
        ctx.filter = 'none';

        // Fusionar trazos de color dibujados
        if (paintCanvas && paintCanvas.style.display !== 'none') {
          ctx.drawImage(paintCanvas, 0, 0, finalCanvas.width, finalCanvas.height);
        }

        const blob = await new Promise((resolve) => {
          finalCanvas.toBlob((b) => resolve(b), 'image/jpeg', 0.85);
        });

        const formData = new FormData();
        formData.append("image", blob, "pixelart_editado.jpg");

        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (data.success) {
          const nuevaUrl = data.data.url;
          const copiaGaleria = [...galeriaActual];
          copiaGaleria[indiceEnEdicion].url = nuevaUrl;

          await guardarGaleriaNube(copiaGaleria);
          cerrarEditor();
        } else {
          throw new Error("La API respondió con error.");
        }
      } catch (err) {
        console.error("Error al guardar:", err);
        alert(`Error al guardar: ${err.message || "Error de conexión"}`);
      } finally {
        btnSave.innerText = "Guardar Imagen";
        btnSave.disabled = false;
      }
    }

    async function editarTitulo(index) {
      if (!isAdmin) return;
      const nuevoTitulo = prompt("Edita el nombre del dibujo:", galeriaActual[index].title);
      
      if (nuevoTitulo !== null && nuevoTitulo.trim() !== "") {
        const copia = [...galeriaActual];
        copia[index].title = nuevoTitulo.trim();
        await guardarGaleriaNube(copia);
      }
    }

    async function eliminarImagen(index) {
      if (!isAdmin) return;
      if (confirm("¿Seguro que quieres eliminar esta imagen?")) {
        const copia = [...galeriaActual];
        copia.splice(index, 1);
        await guardarGaleriaNube(copia);
      }
    }

    function abrirModal(url, title) {
      const modal = document.getElementById('imageModal');
      document.getElementById('modalImg').src = url;
      document.getElementById('modalCaption').innerText = title;
      modal.style.display = "flex";
      agregarEstadoHistorial();
    }

    function cerrarModal(backInHistory = true) {
      document.getElementById('imageModal').style.display = "none";
      if (backInHistory && history.state && history.state.modalOpen) {
        history.back();
      }
    }

    document.addEventListener("DOMContentLoaded", obtenerGaleriaNube);
  </script>
</body>
</html>
