<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Pixel Art</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    
    .admin-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .btn-admin-toggle {
      background: transparent;
      border: 1px solid #444;
      color: #aaa;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8em;
    }
    .btn-admin-toggle:hover { border-color: #3b82f6; color: #fff; }

    h1 { color: #3b82f6; margin-top: 0; }
    
    .card-form {
      display: none;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      text-align: center;
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
    }
    .btn-upload {
      background-color: #359bf0;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    .btn-upload:hover { background-color: #2580d0; }
    #statusMsg { margin-top: 15px; font-size: 0.9em; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 800px;
      margin-top: 20px;
    }
    .gallery-card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #2a2a2a;
    }
    .gallery-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: #000;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .gallery-card img:hover { transform: scale(1.02); }
    .gallery-card h3 {
      font-size: 1rem;
      margin: 12px 0;
      word-break: break-word;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .btn-action {
      background-color: #262626;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: 500;
      color: #e5e5e5;
      transition: all 0.2s ease;
    }
    .btn-edit { border: 1px solid #3b82f6; }
    .btn-edit:hover { background-color: #3b82f6; color: #ffffff; }
    .btn-delete { border: 1px solid #ef4444; }
    .btn-delete:hover { background-color: #ef4444; color: #ffffff; }

    /* --- ESTILO DE PANTALLA COMPLETA EN MODAL --- */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 0;
      margin: 0;
    }
    .modal img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      border-radius: 0;
    }
    .modal-caption {
      position: absolute;
      bottom: 20px;
      font-size: 1.2rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 35px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      z-index: 101;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div class="admin-bar">
    <button class="btn-admin-toggle" onclick="toggleAdminMode()" id="adminBtn">🔐 Modo Admin</button>
  </div>

  <h1>Galería de Pixel Art</h1>

  <div class="card-form" id="uploadForm">
    <h2>Subir nuevo dibujo</h2>
    <input type="text" id="nameInput" placeholder="Nombre del personaje / dibujo">
    
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;" onchange="subirImagen()">
    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
      📷 Tomar Foto / Seleccionar
    </button>

    <div id="statusMsg"></div>
  </div>

  <div class="gallery-grid" id="galleryGrid">Cargando galería...</div>

  <div id="imageModal" class="modal" onclick="cerrarModal()">
    <span class="modal-close">&times;</span>
    <img id="modalImg" src="" alt="Imagen ampliada">
    <div id="modalCaption" class="modal-caption"></div>
  </div>

  <script>
    const IMGBB_API_KEY = "9fc58ee8b707046ece9681fa65e39604";
    const JSONBIN_BIN_ID = "6a7297f9f5f4af5e29ec52c2";
    const JSONBIN_MASTER_KEY = "$2a$10$vygQg5yM2D./HgSdwYY3FurZQV/dUU5iTNvDzdDmi7eQRyVSaA6Fe";
    const ADMIN_PIN = "1234";

    let isAdmin = false;
    let galeriaActual = [];

    async function obtenerGaleriaNube() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
        });
        const data = await res.json();
        
        let datos = data.record || [];
        if (Array.isArray(datos)) {
          galeriaActual = datos.filter(item => item.url && !item.url.includes("sample.jpg"));
        } else {
          galeriaActual = [];
        }

        cargarGaleriaUI();
      } catch (err) {
        console.error("Error al obtener datos:", err);
        document.getElementById('galleryGrid').innerText = "Error al cargar la galería.";
      }
    }

    async function guardarGaleriaNube(nuevaGaleria) {
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": JSONBIN_MASTER_KEY
          },
          body: JSON.stringify(nuevaGaleria)
        });
        galeriaActual = nuevaGaleria;
        cargarGaleriaUI();
      } catch (err) {
        console.error("Error al guardar datos:", err);
      }
    }

    function toggleAdminMode() {
      const uploadForm = document.getElementById('uploadForm');
      if (isAdmin) {
        isAdmin = false;
        document.getElementById('adminBtn').innerText = "🔐 Modo Admin";
        uploadForm.style.display = "none";
      } else {
        const pass = prompt("Ingresa la clave de administrador:");
        if (pass === ADMIN_PIN) {
          isAdmin = true;
          document.getElementById('adminBtn').innerText = "🔓 Salir de Modo Admin";
          uploadForm.style.display = "block";
        } else if (pass !== null) {
          alert("Clave incorrecta.");
        }
      }
      cargarGaleriaUI();
    }

    async function subirImagen() {
      if (!isAdmin) return;
      const nameInput = document.getElementById('nameInput');
      const fileInput = document.getElementById('fileInput');
      const statusMsg = document.getElementById('statusMsg');

      if (!fileInput.files[0]) return;

      const title = nameInput.value.trim() || "Sin título";
      const file = fileInput.files[0];

      statusMsg.innerText = "Subiendo imagen...";
      statusMsg.style.color = "#3b82f6";

      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          const imageUrl = data.data.url;
          const nuevaLista = [{ id: Date.now(), title: title, url: imageUrl }, ...galeriaActual];
          
          await guardarGaleriaNube(nuevaLista);

          nameInput.value = '';
          fileInput.value = '';
          statusMsg.innerText = "¡Imagen guardada en la nube!";
          statusMsg.style.color = "#00d26a";
        } else {
          statusMsg.innerText = "Error al subir la imagen.";
          statusMsg.style.color = "#ff4d4d";
        }
      } catch (error) {
        console.error(error);
        statusMsg.innerText = "Error de conexión.";
        statusMsg.style.color = "#ff4d4d";
      }
    }

    function cargarGaleriaUI() {
      const galleryGrid = document.getElementById('galleryGrid');
      galleryGrid.innerHTML = '';

      if (galeriaActual.length === 0) {
        galleryGrid.innerHTML = '<p style="grid-column: 1/-1; color: #888;">No hay imágenes cargadas aún.</p>';
        return;
      }

      galeriaActual.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        
        const actionButtons = isAdmin ? `
          <div class="card-actions">
            <button class="btn-action btn-edit" onclick="editarTitulo(${index})">✏️ Editar</button>
            <button class="btn-action btn-delete" onclick="eliminarImagen(${index})">🗑️ Eliminar</button>
          </div>
        ` : '';

        card.innerHTML = `
          <img src="${item.url}" alt="${item.title}" onclick="abrirModal('${item.url}', '${item.title}')">
          <h3>${item.title}</h3>
          ${actionButtons}
        `;
        galleryGrid.appendChild(card);
      });
    }

    async function editarTitulo(index) {
      if (!isAdmin) return;
      const nuevoTitulo = prompt("Edita el nombre del dibujo:", galeriaActual[index].title);
      
      if (nuevoTitulo !== null && nuevoTitulo.trim() !== "") {
        const copia = [...galeriaActual];
        copia[index].title = nuevoTitulo.trim();
        await guardarGaleriaNube(copia);
      }
    }

    async function eliminarImagen(index) {
      if (!isAdmin) return;
      if (confirm("¿Seguro que quieres eliminar esta imagen?")) {
        const copia = [...galeriaActual];
        copia.splice(index, 1);
        await guardarGaleriaNube(copia);
      }
    }

    function abrirModal(url, title) {
      const modal = document.getElementById('imageModal');
      document.getElementById('modalImg').src = url;
      document.getElementById('modalCaption').innerText = title;
      modal.style.display = "flex";
    }

    function cerrarModal() {
      document.getElementById('imageModal').style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", obtenerGaleriaNube);
  </script>
</body>
</html>
