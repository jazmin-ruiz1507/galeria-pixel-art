<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Pixel Art</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      margin: 0;
    }

    h1 { color: #3b82f6; margin-top: 0; font-size: 1.6rem; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin-top: 15px;
    }
    .gallery-card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      border: 1px solid #2a2a2a;
    }
    .gallery-card img {
      width: 100%;
      height: 140px;
      object-fit: contain;
      background: #000;
      border-radius: 6px;
    }

    .btn-action {
      background-color: #eab308;
      color: #000;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8em;
      font-weight: bold;
      border: none;
      margin-top: 5px;
      width: 100%;
    }

    /* Editor Modal */
    .editor-modal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #121212;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      box-sizing: border-box;
    }

    /* Selector de Modos Separados */
    .mode-selector {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 450px;
      margin-bottom: 10px;
    }
    .btn-tab {
      flex: 1;
      padding: 10px;
      background: #2a2a2a;
      color: #888;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-tab.active {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }

    .editor-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 50vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      overflow: hidden;
    }
    .editor-container img {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    .paint-canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 100;
      touch-action: none;
      cursor: crosshair;
      display: none;
    }

    /* Paneles e Interfaz Separada */
    .tool-panel {
      width: 100%;
      max-width: 450px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .tool-panel.active { display: flex; }

    .color-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e1e1e;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
    }
    input[type="color"] {
      border: none;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .editor-btns {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 450px;
    }
    .btn-save {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      flex: 1;
      cursor: pointer;
    }
    .btn-cancel {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 12px;
      border-radius: 8px;
      flex: 1;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Galería de Pixel Art</h1>
  <div class="gallery-grid" id="galleryGrid">Cargando...</div>

  <div id="editorModal" class="editor-modal">
    <!-- Pestañas de modo -->
    <div class="mode-selector">
      <button id="tabCrop" class="btn-tab active" onclick="cambiarModo('crop')">✂️ Recortar</button>
      <button id="tabPaint" class="btn-tab" onclick="cambiarModo('paint')">🎨 Pincel / Tapar Firma</button>
    </div>

    <div class="editor-container" id="editorContainer">
      <img id="imageToEdit" src="" alt="Editar">
      <canvas id="paintCanvas" class="paint-canvas"></canvas>
    </div>

    <!-- Panel 1: Recorte -->
    <div id="panelCrop" class="tool-panel active">
      <button class="btn-action" style="padding: 12px; background: #eab308;" onclick="aplicarRecorte()">Aplicar Recorte Área Seleccionada</button>
    </div>

    <!-- Panel 2: Pincel (Aparte) -->
    <div id="panelPaint" class="tool-panel">
      <div class="color-panel">
        <div>
          <label style="font-size: 0.8rem;">Color:</label>
          <input type="color" id="brushColor" value="#000000">
        </div>
        <div>
          <label style="font-size: 0.8rem;">Grosor:</label>
          <input type="range" id="brushSize" min="5" max="50" value="20" style="width: 80px;">
        </div>
        <button style="background: #2a2a2a; color: #ef4444; border: 1px solid #ef4444; border-radius: 6px; padding: 5px 10px;" onclick="deshacer()">↩️ Deshacer</button>
      </div>
    </div>

    <div class="editor-btns">
      <button class="btn-cancel" onclick="cerrarEditor()">Cancelar</button>
      <button class="btn-save" id="btnSave" onclick="guardarImagen()">Guardar Cambios</button>
    </div>
  </div>

  <script>
    const IMGBB_API_KEY = "9fc58ee8b707046ece9681fa65e39604";
    const JSONBIN_BIN_ID = "6a7297f9f5f4af5e29ec52c2";
    const JSONBIN_MASTER_KEY = "$2a$10$vygQg5yM2D./HgSdwYY3FurZQV/dUU5iTNvDzdDmi7eQRyVSaA6Fe";

    let galeriaActual = [];
    let cropper = null;
    let indiceEnEdicion = -1;
    let paintCanvas, paintCtx, isDrawing = false;
    let historyStack = [];

    async function cargarGaleria() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
        });
        const data = await res.json();
        galeriaActual = Array.isArray(data.record) ? data.record : [];
        
        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = '';
        galeriaActual.forEach((item, index) => {
          grid.innerHTML += `
            <div class="gallery-card">
              <img src="${item.url}" alt="${item.title}">
              <button class="btn-action" onclick="abrirEditor(${index})">⚙️ Editar Imagen</button>
            </div>
          `;
        });
      } catch (e) { console.error(e); }
    }

    function abrirEditor(index) {
      indiceEnEdicion = index;
      const modal = document.getElementById('editorModal');
      const img = document.getElementById('imageToEdit');
      
      modal.style.display = "flex";
      img.crossOrigin = "anonymous";
      img.src = galeriaActual[index].url;

      img.onload = function() {
        cambiarModo('crop');
      };
    }

    function cambiarModo(modo) {
      const img = document.getElementById('imageToEdit');
      paintCanvas = document.getElementById('paintCanvas');

      document.getElementById('tabCrop').classList.toggle('active', modo === 'crop');
      document.getElementById('tabPaint').classList.toggle('active', modo === 'paint');
      document.getElementById('panelCrop').classList.toggle('active', modo === 'crop');
      document.getElementById('panelPaint').classList.toggle('active', modo === 'paint');

      if (modo === 'crop') {
        paintCanvas.style.display = "none";
        if (!cropper) {
          cropper = new Cropper(img, { viewMode: 1, autoCropArea: 0.9 });
        }
      } else if (modo === 'paint') {
        // Al pasar a modo Pincel, destruimos cropper para liberar la imagen
        if (cropper) {
          const croppedCanvas = cropper.getCroppedCanvas();
          if (croppedCanvas) {
            img.src = croppedCanvas.toDataURL('image/jpeg');
          }
          cropper.destroy();
          cropper = null;
        }
        
        setTimeout(activarPincel, 150);
      }
    }

    function aplicarRecorte() {
      if (cropper) {
        const croppedCanvas = cropper.getCroppedCanvas();
        document.getElementById('imageToEdit').src = croppedCanvas.toDataURL('image/jpeg');
        cropper.destroy();
        cropper = null;
        cambiarModo('paint');
      }
    }

    function activarPincel() {
      const img = document.getElementById('imageToEdit');
      const container = document.getElementById('editorContainer');
      paintCanvas = document.getElementById('paintCanvas');

      const rectImg = img.getBoundingClientRect();
      const rectContainer = container.getBoundingClientRect();

      paintCanvas.style.left = (rectImg.left - rectContainer.left) + "px";
      paintCanvas.style.top = (rectImg.top - rectContainer.top) + "px";
      paintCanvas.style.width = rectImg.width + "px";
      paintCanvas.style.height = rectImg.height + "px";

      paintCanvas.width = img.naturalWidth;
      paintCanvas.height = img.naturalHeight;

      paintCanvas.style.display = "block";
      paintCtx = paintCanvas.getContext('2d');
      paintCtx.lineCap = 'round';
      paintCtx.lineJoin = 'round';

      // Asignar controladores
      paintCanvas.onmousedown = empezar;
      paintCanvas.onmousemove = mover;
      paintCanvas.onmouseup = parar;

      paintCanvas.ontouchstart = (e) => empezar(e.touches[0]);
      paintCanvas.ontouchmove = (e) => { e.preventDefault(); mover(e.touches[0]); };
      paintCanvas.ontouchend = parar;
      
      historyStack = [];
      guardarPaso();
    }

    function getPos(e) {
      const rect = paintCanvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (paintCanvas.width / rect.width),
        y: (e.clientY - rect.top) * (paintCanvas.height / rect.height)
      };
    }

    function empezar(e) {
      isDrawing = true;
      const p = getPos(e);
      paintCtx.beginPath();
      paintCtx.fillStyle = document.getElementById('brushColor').value;
      paintCtx.arc(p.x, p.y, document.getElementById('brushSize').value / 2, 0, Math.PI * 2);
      paintCtx.fill();
      paintCtx.beginPath();
      paintCtx.moveTo(p.x, p.y);
    }

    function mover(e) {
      if (!isDrawing) return;
      const p = getPos(e);
      paintCtx.strokeStyle = document.getElementById('brushColor').value;
      paintCtx.lineWidth = document.getElementById('brushSize').value;
      paintCtx.lineTo(p.x, p.y);
      paintCtx.stroke();
    }

    function parar() {
      if (isDrawing) {
        paintCtx.closePath();
        isDrawing = false;
        guardarPaso();
      }
    }

    function guardarPaso() {
      if (paintCtx) historyStack.push(paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height));
    }

    function deshacer() {
      if (historyStack.length > 1) {
        historyStack.pop();
        paintCtx.putImageData(historyStack[historyStack.length - 1], 0, 0);
      }
    }

    function cerrarEditor() {
      if (cropper) { cropper.destroy(); cropper = null; }
      document.getElementById('editorModal').style.display = "none";
    }

    async function guardarImagen() {
      const btn = document.getElementById('btnSave');
      btn.innerText = "Guardando...";
      btn.disabled = true;

      try {
        const img = document.getElementById('imageToEdit');
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = img.naturalWidth;
        finalCanvas.height = img.naturalHeight;
        const ctx = finalCanvas.getContext('2d');

        ctx.drawImage(img, 0, 0);

        if (paintCanvas && paintCanvas.style.display !== 'none') {
          ctx.drawImage(paintCanvas, 0, 0);
        }

        const blob = await new Promise(res => finalCanvas.toBlob(res, 'image/jpeg', 0.95));
        const formData = new FormData();
        formData.append("image", blob, "pixelart.jpg");

        const uploadRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        const uploadData = await uploadRes.json();

        if (uploadData.success) {
          galeriaActual[indiceEnEdicion].url = uploadData.data.url;
          await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_MASTER_KEY },
            body: JSON.stringify(galeriaActual)
          });
          cargarGaleria();
          cerrarEditor();
        }
      } catch (e) {
        alert("Error al guardar la edición.");
      } finally {
        btn.innerText = "Guardar Cambios";
        btn.disabled = false;
      }
    }

    document.addEventListener("DOMContentLoaded", cargarGaleria);
  </script>
</body>
</html>
