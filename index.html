<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Pixel Art</title>
  
  <!-- Estilos e librería de Cropper.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      margin: 0;
      overflow-x: hidden;
    }
    
    .admin-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .btn-admin-toggle {
      background: transparent;
      border: 1px solid #444;
      color: #aaa;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8em;
    }
    .btn-admin-toggle:hover { border-color: #3b82f6; color: #fff; }

    h1 { color: #3b82f6; margin-top: 0; font-size: 1.6rem; }
    
    .card-form {
      display: none;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      text-align: center;
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
    }
    .btn-upload {
      background-color: #359bf0;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    .btn-upload:hover { background-color: #2580d0; }
    #statusMsg { margin-top: 15px; font-size: 0.9em; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin-top: 15px;
      box-sizing: border-box;
    }
    .gallery-card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #2a2a2a;
      box-sizing: border-box;
    }
    .gallery-card img {
      width: 100%;
      height: 140px;
      object-fit: contain;
      background: #000;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .gallery-card img:hover { transform: scale(1.02); }
    .gallery-card h3 {
      font-size: 0.9rem;
      margin: 8px 0;
      word-break: break-word;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
    }
    .btn-action {
      background-color: #262626;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75em;
      font-weight: 500;
      color: #e5e5e5;
      transition: all 0.2s ease;
      border: 1px solid #444;
    }
    .btn-edit { border-color: #3b82f6; }
    .btn-edit:hover { background-color: #3b82f6; color: #ffffff; }
    .btn-crop { border-color: #eab308; }
    .btn-crop:hover { background-color: #eab308; color: #000; }
    .btn-delete { border-color: #ef4444; }
    .btn-delete:hover { background-color: #ef4444; color: #ffffff; }

    /* --- MODAL PANTALLA COMPLETA --- */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .modal img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
    .modal-caption {
      position: absolute;
      bottom: 25px;
      font-size: 1.1rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 16px;
      border-radius: 20px;
    }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 35px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      z-index: 101;
    }

    /* --- MODAL EDITOR Y PINTADO --- */
    .editor-modal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #121212;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 10px;
    }
    .editor-container {
      position: relative;
      width: 100%;
      height: 50vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 8px;
    }
    
    .editor-container img {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    /* CANVAS DE DIBUJO CAPA SUPERIOR */
    .paint-canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 50;
      touch-action: none;
      display: none;
      cursor: crosshair;
    }

    .editor-controls {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: center;
      padding: 10px 0;
    }

    .btn-do-crop {
      background: #eab308;
      color: #000000;
      font-weight: bold;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      width: 100%;
    }
    .btn-do-crop:hover { background: #ca8a04; color: #fff; }

    .color-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e1e1e;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
      gap: 5px;
    }
    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 2px solid #fff; border-radius: 50%; }

    .btn-undo, .btn-clear-paint {
      background: #2a2a2a;
      color: #ef4444;
      border: 1px solid #ef4444;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-undo:hover { background: #ef4444; color: #fff; }
    .btn-clear-paint { color: #aaa; border-color: #444; }
    .btn-clear-paint:hover { background: #444; color: #fff; }

    .editor-controls label { font-size: 0.85rem; color: #ccc; }
    
    .editor-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 5px;
    }
    .btn-editor-save {
      background: #3b82f6;
      border: none;
      color: #ffffff;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      flex: 1;
    }
    .btn-editor-save:hover { background: #2563eb; }
    .btn-editor-cancel {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      flex: 1;
    }
    .btn-editor-cancel:hover { background: #3d3d3d; }
  </style>
</head>
<body>

  <div class="admin-bar">
    <button class="btn-admin-toggle" onclick="toggleAdminMode()" id="adminBtn">🔐 Modo Admin</button>
  </div>

  <h1>Galería de Pixel Art</h1>

  <div class="card-form" id="uploadForm">
    <h2>Subir nuevo dibujo</h2>
    <input type="text" id="nameInput" placeholder="Nombre del personaje / dibujo">
    
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;" onchange="subirImagen()">
    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
      📷 Tomar Foto / Seleccionar
    </button>

    <div id="statusMsg"></div>
  </div>

  <div class="gallery-grid" id="galleryGrid">Cargando galería...</div>

  <!-- Modal Ver Imagen -->
  <div id="imageModal" class="modal" onclick="cerrarModal()">
    <span class="modal-close">&times;</span>
    <img id="modalImg" src="" alt="Imagen ampliada">
    <div id="modalCaption" class="modal-caption"></div>
  </div>

  <!-- Modal Editor de Imagen y Pincel -->
  <div id="editorModal" class="editor-modal">
    <h3 style="margin: 5px 0 10px; font-size: 1.2rem;">Editar Imagen & Tapar Firma</h3>
    <div class="editor-container" id="editorContainer">
      <img id="imageToEdit" src="" alt="Editar">
      <canvas id="paintCanvas" class="paint-canvas"></canvas>
    </div>
    
    <div class="editor-controls">
      <!-- Botón para Recortar -->
      <button class="btn-do-crop" id="btnCrop" onclick="aplicarRecorteManual()">✂️ Recortar Imagen Selección</button>

      <!-- Panel del Pincel -->
      <div id="paintTools" class="color-panel" style="display: none;">
        <div class="color-picker-wrapper">
          <label>Color:</label>
          <input type="color" id="brushColor" value="#000000">
        </div>
        <div>
          <label>Grosor:</label>
          <input type="range" id="brushSize" min="5" max="50" value="20" style="width: 80px;">
        </div>
        <div style="display: flex; gap: 5px;">
            <button class="btn-undo" onclick="deshacerPintura()">↩️ Deshacer</button>
            <button class="btn-clear-paint" onclick="limpiarPintura()">🗑️ Limpiar</button>
        </div>
      </div>

      <div style="margin: 5px 0;">
        <label style="display: inline-block; width: 80px; text-align: left;">Brillo: <span id="brightnessVal">100%</span></label>
        <input type="range" id="brightnessRange" min="50" max="200" value="100" style="vertical-align: middle; width: calc(100% - 90px);" oninput="ajustarBrillo(this.value)">
      </div>
      
      <div class="editor-btns">
        <button class="btn-editor-cancel" onclick="cerrarEditor()">Cancelar</button>
        <button class="btn-editor-save" id="btnSaveEdit" onclick="guardarEdicion()">Guardar Imagen</button>
      </div>
    </div>
  </div>

  <script>
    const IMGBB_API_KEY = "9fc58ee8b707046ece9681fa65e39604";
    const JSONBIN_BIN_ID = "6a7297f9f5f4af5e29ec52c2";
    const JSONBIN_MASTER_KEY = "$2a$10$vygQg5yM2D./HgSdwYY3FurZQV/dUU5iTNvDzdDmi7eQRyVSaA6Fe";
    const ADMIN_PIN = "1234";

    let isAdmin = false;
    let galeriaActual = [];
    let cropper = null;
    let indiceEnEdicion = -1;
    let valorBrilloActual = 100;

    // Variables de Pincel
    let paintCanvas = null;
    let paintCtx = null;
    let isDrawing = false;
    let historyStack = [];

    async function obtenerGaleriaNube() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
        });
        const data = await res.json();
        let datos = data.record || [];
        galeriaActual = Array.isArray(datos) ? datos.filter(item => item.url && !item.url.includes("sample.jpg")) : [];
        cargarGaleriaUI();
      } catch (err) {
        console.error("Error al obtener datos:", err);
      }
    }

    async function guardarGaleriaNube(nuevaGaleria) {
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": JSONBIN_MASTER_KEY
          },
          body: JSON.stringify(nuevaGaleria)
        });
        galeriaActual = nuevaGaleria;
        cargarGaleriaUI();
      } catch (err) {
        console.error("Error al guardar datos:", err);
      }
    }

    function toggleAdminMode() {
      const uploadForm = document.getElementById('uploadForm');
      if (isAdmin) {
        isAdmin = false;
        document.getElementById('adminBtn').innerText = "🔐 Modo Admin";
        uploadForm.style.display = "none";
      } else {
        const pass = prompt("Ingresa la clave de administrador:");
        if (pass === ADMIN_PIN) {
          isAdmin = true;
          document.getElementById('adminBtn').innerText = "🔓 Salir de Modo Admin";
          uploadForm.style.display = "block";
        } else if (pass !== null) {
          alert("Clave incorrecta.");
        }
      }
      cargarGaleriaUI();
    }

    function cargarGaleriaUI() {
      const galleryGrid = document.getElementById('galleryGrid');
      galleryGrid.innerHTML = '';

      if (galeriaActual.length === 0) {
        galleryGrid.innerHTML = '<p style="grid-column: 1/-1; color: #888;">No hay imágenes cargadas aún.</p>';
        return;
      }

      galeriaActual.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        
        const actionButtons = isAdmin ? `
          <div class="card-actions">
            <button class="btn-action btn-edit" onclick="editarTitulo(${index})">✏️ Renombrar</button>
            <button class="btn-action btn-crop" onclick="abrirEditor(${index})">✂️ Editar/Tapar Firma</button>
            <button class="btn-action btn-delete" onclick="eliminarImagen(${index})">🗑️ Eliminar</button>
          </div>
        ` : '';

        card.innerHTML = `
          <img src="${item.url}" alt="${item.title}" loading="lazy" onclick="abrirModal('${item.url}', '${item.title}')">
          <h3>${item.title}</h3>
          ${actionButtons}
        `;
        galleryGrid.appendChild(card);
      });
    }

    /* --- EDITOR & HERRAMIENTAS --- */
    function abrirEditor(index) {
      if (!isAdmin) return;
      indiceEnEdicion = index;
      const item = galeriaActual[index];
      
      const imageToEdit = document.getElementById('imageToEdit');
      const editorModal = document.getElementById('editorModal');
      
      document.getElementById('brightnessRange').value = 100;
      document.getElementById('brightnessVal').innerText = "100%";
      document.getElementById('paintTools').style.display = "none";
      document.getElementById('btnCrop').style.display = "block";
      document.getElementById('paintCanvas').style.display = "none";

      valorBrilloActual = 100;
      historyStack = [];
      imageToEdit.style.filter = "none";

      editorModal.style.display = "flex";

      imageToEdit.crossOrigin = "anonymous";
      imageToEdit.src = item.url;
      
      imageToEdit.onload = function() {
        if (cropper) { cropper.destroy(); }
        cropper = new Cropper(imageToEdit, {
          viewMode: 1,
          autoCropArea: 0.9,
          responsive: true,
          restore: false
        });
      };
    }

    function aplicarRecorteManual() {
      if (!cropper) return;

      const canvasCortado = cropper.getCroppedCanvas({ maxWidth: 1200, maxHeight: 1200 });
      if (!canvasCortado) return;

      const imageToEdit = document.getElementById('imageToEdit');
      
      // Destruir completamente Cropper antes de pasar a modo dibujo
      cropper.destroy();
      cropper = null;

      imageToEdit.src = canvasCortado.toDataURL('image/jpeg', 0.95);
      
      imageToEdit.onload = function() {
        document.getElementById('btnCrop').style.display = "none";
        document.getElementById('paintTools').style.display = "flex";

        // Inicializar el lienzo de dibujo sobre la imagen
        setTimeout(configurarLienzoPintura, 100);
      };
    }

    function configurarLienzoPintura() {
      paintCanvas = document.getElementById('paintCanvas');
      const img = document.getElementById('imageToEdit');
      const container = document.getElementById('editorContainer');

      // Obtener posición y dimensión exacta de la imagen renderizada en pantalla
      const rectImg = img.getBoundingClientRect();
      const rectContainer = container.getBoundingClientRect();

      // Ajustar posición del canvas alineado a la imagen
      paintCanvas.style.left = (rectImg.left - rectContainer.left) + "px";
      paintCanvas.style.top = (rectImg.top - rectContainer.top) + "px";
      paintCanvas.style.width = rectImg.width + "px";
      paintCanvas.style.height = rectImg.height + "px";

      // Tamaño de renderizado interno de la imagen real
      paintCanvas.width = img.naturalWidth || rectImg.width;
      paintCanvas.height = img.naturalHeight || rectImg.height;

      paintCanvas.style.display = "block";
      paintCtx = paintCanvas.getContext('2d');
      paintCtx.lineCap = 'round';
      paintCtx.lineJoin = 'round';

      historyStack = [];
      guardarEstadoPintura();

      // Registrar Eventos del ratón y pantalla táctil
      paintCanvas.onmousedown = empezarDibujo;
      paintCanvas.onmousemove = dibujar;
      paintCanvas.onmouseup = detenerDibujo;
      paintCanvas.onmouseleave = detenerDibujo;

      paintCanvas.ontouchstart = (e) => { empezarDibujo(e.touches[0]); };
      paintCanvas.ontouchmove = (e) => { 
        e.preventDefault(); 
        dibujar(e.touches[0]); 
      };
      paintCanvas.ontouchend = detenerDibujo;
    }

    function obtenerPosicionCoords(e) {
      const rect = paintCanvas.getBoundingClientRect();
      const scaleX = paintCanvas.width / rect.width;
      const scaleY = paintCanvas.height / rect.height;

      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    function empezarDibujo(e) {
      isDrawing = true;
      paintCtx.beginPath();
      const pos = obtenerPosicionCoords(e);
      paintCtx.moveTo(pos.x, pos.y);
      
      // Dibujar un trazo/punto inicial
      const color = document.getElementById('brushColor').value;
      const size = document.getElementById('brushSize').value;
      paintCtx.fillStyle = color;
      paintCtx.arc(pos.x, pos.y, size / 2, 0, Math.PI * 2);
      paintCtx.fill();
      paintCtx.beginPath();
      paintCtx.moveTo(pos.x, pos.y);
    }

    function dibujar(e) {
      if (!isDrawing) return;
      const pos = obtenerPosicionCoords(e);
      const color = document.getElementById('brushColor').value;
      const size = document.getElementById('brushSize').value;

      paintCtx.strokeStyle = color;
      paintCtx.lineWidth = size;
      paintCtx.lineTo(pos.x, pos.y);
      paintCtx.stroke();
    }

    function detenerDibujo() {
      if (isDrawing) {
        paintCtx.closePath();
        isDrawing = false;
        guardarEstadoPintura();
      }
    }

    function guardarEstadoPintura() {
      if (!paintCtx) return;
      historyStack.push(paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height));
      if (historyStack.length > 15) historyStack.shift();
    }

    function deshacerPintura() {
      if (historyStack.length > 1) {
        historyStack.pop();
        const prev = historyStack[historyStack.length - 1];
        paintCtx.putImageData(prev, 0, 0);
      }
    }
    
    function limpiarPintura() {
      if (paintCtx && paintCanvas) {
        paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
        historyStack = [];
        guardarEstadoPintura();
      }
    }

    function ajustarBrillo(val) {
      valorBrilloActual = val;
      document.getElementById('brightnessVal').innerText = val + "%";
      const img = document.getElementById('imageToEdit');
      if (img) img.style.filter = `brightness(${val}%)`;
    }

    function cerrarEditor() {
      if (cropper) { cropper.destroy(); cropper = null; }
      document.getElementById('editorModal').style.display = "none";
      indiceEnEdicion = -1;
    }

    async function guardarEdicion() {
      if (indiceEnEdicion === -1) return;

      const btnSave = document.getElementById('btnSaveEdit');
      btnSave.innerText = "Guardando...";
      btnSave.disabled = true;

      try {
        let baseCanvas;

        if (cropper) {
          baseCanvas = cropper.getCroppedCanvas({ maxWidth: 1200, maxHeight: 1200 });
        } else {
          const img = document.getElementById('imageToEdit');
          baseCanvas = document.createElement('canvas');
          baseCanvas.width = img.naturalWidth;
          baseCanvas.height = img.naturalHeight;
          const ctx = baseCanvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
        }

        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = baseCanvas.width;
        finalCanvas.height = baseCanvas.height;
        const ctx = finalCanvas.getContext('2d');

        // Aplicar el brillo a la imagen final
        ctx.filter = `brightness(${valorBrilloActual}%)`;
        ctx.drawImage(baseCanvas, 0, 0);
        ctx.filter = 'none';

        // Unir los trazos dibujados encima
        if (!cropper && paintCanvas && paintCanvas.style.display !== 'none') {
          ctx.drawImage(paintCanvas, 0, 0, finalCanvas.width, finalCanvas.height);
        }

        const blob = await new Promise((resolve) => finalCanvas.toBlob(resolve, 'image/jpeg', 0.9));

        const formData = new FormData();
        formData.append("image", blob, "pixelart_editado.jpg");

        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (data.success) {
          const copiaGaleria = [...galeriaActual];
          copiaGaleria[indiceEnEdicion].url = data.data.url;
          await guardarGaleriaNube(copiaGaleria);
          cerrarEditor();
        } else {
          alert("Error al guardar la imagen.");
        }
      } catch (err) {
        console.error(err);
        alert("Ocurrió un error al subir la edición.");
      } finally {
        btnSave.innerText = "Guardar Imagen";
        btnSave.disabled = false;
      }
    }

    function abrirModal(url, title) {
      document.getElementById('modalImg').src = url;
      document.getElementById('modalCaption').innerText = title;
      document.getElementById('imageModal').style.display = "flex";
    }

    function cerrarModal() {
      document.getElementById('imageModal').style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", obtenerGaleriaNube);
  </script>
</body>
</html>
