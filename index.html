<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Pixel Art</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      margin: 0;
      overflow-x: hidden;
    }
    
    .admin-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .btn-admin-toggle {
      background: transparent;
      border: 1px solid #444;
      color: #aaa;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8em;
    }
    .btn-admin-toggle:hover { border-color: #3b82f6; color: #fff; }

    h1 { color: #3b82f6; margin-top: 0; font-size: 1.6rem; }
    
    .card-form {
      display: none;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      text-align: center;
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
    }
    .btn-upload {
      background-color: #359bf0;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    .btn-upload:hover { background-color: #2580d0; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin-top: 15px;
      box-sizing: border-box;
    }
    .gallery-card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #2a2a2a;
      box-sizing: border-box;
    }
    .gallery-card img {
      width: 100%;
      height: 140px;
      object-fit: contain;
      background: #000;
      border-radius: 6px;
    }
    .gallery-card h3 {
      font-size: 0.9rem;
      margin: 8px 0;
      word-break: break-word;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
    }
    .btn-action {
      background-color: #262626;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75em;
      font-weight: 500;
      color: #e5e5e5;
      border: 1px solid #444;
    }
    .btn-edit { border-color: #3b82f6; }
    .btn-edit:hover { background-color: #3b82f6; color: #ffffff; }
    .btn-crop { border-color: #eab308; }
    .btn-crop:hover { background-color: #eab308; color: #000; }
    .btn-delete { border-color: #ef4444; }
    .btn-delete:hover { background-color: #ef4444; color: #ffffff; }

    /* EDITOR MODAL */
    .editor-modal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #121212;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      box-sizing: border-box;
    }

    .mode-selector {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 450px;
      margin-bottom: 10px;
    }
    .btn-tab {
      flex: 1;
      padding: 10px;
      background: #2a2a2a;
      color: #888;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-tab.active {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }

    .editor-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 50vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      overflow: hidden;
    }

    #imageToEdit {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    #paintCanvas {
      position: absolute;
      z-index: 150;
      touch-action: none;
      cursor: crosshair;
      display: none;
    }

    .tool-panel {
      width: 100%;
      max-width: 450px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .tool-panel.active { display: flex; }

    .color-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e1e1e;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
    }
    input[type="color"] {
      border: none;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .editor-btns {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 450px;
    }
    .btn-save {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      flex: 1;
      cursor: pointer;
    }
    .btn-cancel {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 12px;
      border-radius: 8px;
      flex: 1;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="admin-bar">
    <button class="btn-admin-toggle" onclick="toggleAdminMode()" id="adminBtn">🔐 Modo Admin</button>
  </div>

  <h1>Galería de Pixel Art</h1>

  <div class="card-form" id="uploadForm">
    <h2>Subir nuevo dibujo</h2>
    <input type="text" id="nameInput" placeholder="Nombre del personaje / dibujo">
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;" onchange="subirImagen()">
    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
      📷 Tomar Foto / Seleccionar
    </button>
    <div id="statusMsg" style="margin-top: 10px; font-size: 0.9em;"></div>
  </div>

  <div class="gallery-grid" id="galleryGrid">Cargando galería...</div>

  <!-- EDITOR MODAL -->
  <div id="editorModal" class="editor-modal">
    <div class="mode-selector">
      <button id="tabCrop" class="btn-tab active" onclick="cambiarModo('crop')">✂️ Recortar</button>
      <button id="tabPaint" class="btn-tab" onclick="cambiarModo('paint')">🎨 Pincel / Tapar Firma</button>
    </div>

    <div class="editor-wrapper" id="editorWrapper">
      <img id="imageToEdit" src="" alt="Editar">
      <canvas id="paintCanvas"></canvas>
    </div>

    <div id="panelCrop" class="tool-panel active">
      <button class="btn-action" style="padding: 12px; background: #eab308; color: #000; font-weight: bold; font-size: 0.9rem;" onclick="aplicarRecorte()">Aplicar Recorte</button>
    </div>

    <div id="panelPaint" class="tool-panel">
      <div class="color-panel">
        <div>
          <label style="font-size: 0.8rem;">Color:</label>
          <input type="color" id="brushColor" value="#000000">
        </div>
        <div>
          <label style="font-size: 0.8rem;">Grosor:</label>
          <input type="range" id="brushSize" min="5" max="50" value="20" style="width: 80px;">
        </div>
        <button style="background: #2a2a2a; color: #ef4444; border: 1px solid #ef4444; border-radius: 6px; padding: 5px 10px; cursor: pointer;" onclick="deshacer()">↩️ Deshacer</button>
      </div>
    </div>

    <div class="editor-btns">
      <button class="btn-cancel" onclick="cerrarEditor()">Cancelar</button>
      <button class="btn-save" id="btnSave" onclick="guardarImagen()">Guardar Cambios</button>
    </div>
  </div>

  <script>
    const IMGBB_API_KEY = "9fc58ee8b707046ece9681fa65e39604";
    const JSONBIN_BIN_ID = "6a7297f9f5f4af5e29ec52c2";
    const JSONBIN_MASTER_KEY = "$2a$10$vygQg5yM2D./HgSdwYY3FurZQV/dUU5iTNvDzdDmi7eQRyVSaA6Fe";
    const ADMIN_PIN = "1234";

    let isAdmin = false;
    let galeriaActual = [];
    let cropper = null;
    let indiceEnEdicion = -1;
    let paintCanvas, paintCtx, isDrawing = false;
    let historyStack = [];

    function toggleAdminMode() {
      const uploadForm = document.getElementById('uploadForm');
      if (isAdmin) {
        isAdmin = false;
        document.getElementById('adminBtn').innerText = "🔐 Modo Admin";
        uploadForm.style.display = "none";
      } else {
        const pass = prompt("Ingresa la clave de administrador:");
        if (pass === ADMIN_PIN) {
          isAdmin = true;
          document.getElementById('adminBtn').innerText = "🔓 Salir de Modo Admin";
          uploadForm.style.display = "block";
        } else if (pass !== null) {
          alert("Clave incorrecta.");
        }
      }
      cargarGaleriaUI();
    }

    async function cargarGaleria() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
        });
        const data = await res.json();
        galeriaActual = Array.isArray(data.record) ? data.record : [];
        cargarGaleriaUI();
      } catch (e) { console.error(e); }
    }

    function cargarGaleriaUI() {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';

      if (galeriaActual.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; color: #888;">No hay imágenes registradas.</p>';
        return;
      }

      galeriaActual.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'gallery-card';

        const actionButtons = isAdmin ? `
          <div class="card-actions">
            <button class="btn-action btn-edit" onclick="renombrar(${index})">✏️ Renombrar</button>
            <button class="btn-action btn-crop" onclick="abrirEditor(${index})">⚙️ Editar / Tapar Firma</button>
            <button class="btn-action btn-delete" onclick="eliminar(${index})">🗑️ Eliminar</button>
          </div>
        ` : '';

        card.innerHTML = `
          <img src="${item.url}" alt="${item.title}">
          <h3>${item.title}</h3>
          ${actionButtons}
        `;
        grid.appendChild(card);
      });
    }

    async function guardarGaleriaNube(nuevaGaleria) {
      await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_MASTER_KEY },
        body: JSON.stringify(nuevaGaleria)
      });
      galeriaActual = nuevaGaleria;
      cargarGaleriaUI();
    }

    async function subirImagen() {
      const fileInput = document.getElementById('fileInput');
      const nameInput = document.getElementById('nameInput');
      const statusMsg = document.getElementById('statusMsg');

      if (!fileInput.files[0]) return;
      const title = nameInput.value.trim() || "Sin Título";

      statusMsg.innerText = "Subiendo imagen...";

      try {
        const formData = new FormData();
        formData.append("image", fileInput.files[0]);

        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        const data = await res.json();

        if (data.success) {
          const nuevaGaleria = [...galeriaActual, { title: title, url: data.data.url }];
          await guardarGaleriaNube(nuevaGaleria);
          statusMsg.innerText = "¡Imagen guardada!";
          nameInput.value = "";
          fileInput.value = "";
        }
      } catch (err) {
        statusMsg.innerText = "Error al subir la imagen.";
      }
    }

    async function renombrar(index) {
      const nuevoNombre = prompt("Nuevo nombre para la obra:", galeriaActual[index].title);
      if (nuevoNombre && nuevoNombre.trim() !== "") {
        const copia = [...galeriaActual];
        copia[index].title = nuevoNombre.trim();
        await guardarGaleriaNube(copia);
      }
    }

    async function eliminar(index) {
      if (confirm(`¿Eliminar "${galeriaActual[index].title}"?`)) {
        const copia = [...galeriaActual];
        copia.splice(index, 1);
        await guardarGaleriaNube(copia);
      }
    }

    function abrirEditor(index) {
      indiceEnEdicion = index;
      const modal = document.getElementById('editorModal');
      const img = document.getElementById('imageToEdit');
      
      modal.style.display = "flex";
      img.crossOrigin = "anonymous";
      img.src = galeriaActual[index].url;

      img.onload = function() {
        cambiarModo('crop');
      };
    }

    function cambiarModo(modo) {
      const img = document.getElementById('imageToEdit');
      paintCanvas = document.getElementById('paintCanvas');

      document.getElementById('tabCrop').classList.toggle('active', modo === 'crop');
      document.getElementById('tabPaint').classList.toggle('active', modo === 'paint');
      document.getElementById('panelCrop').classList.toggle('active', modo === 'crop');
      document.getElementById('panelPaint').classList.toggle('active', modo === 'paint');

      if (modo === 'crop') {
        paintCanvas.style.display = "none";
        if (!cropper) {
          cropper = new Cropper(img, { 
            viewMode: 1, 
            autoCropArea: 0.9,
            zoomable: false
          });
        }
      } else if (modo === 'paint') {
        if (cropper) {
          const croppedCanvas = cropper.getCroppedCanvas();
          if (croppedCanvas) {
            img.src = croppedCanvas.toDataURL('image/jpeg');
          }
          cropper.destroy();
          cropper = null;
        }
        setTimeout(activarPincel, 100);
      }
    }

    function aplicarRecorte() {
      if (cropper) {
        const croppedCanvas = cropper.getCroppedCanvas();
        document.getElementById('imageToEdit').src = croppedCanvas.toDataURL('image/jpeg');
        cropper.destroy();
        cropper = null;
        cambiarModo('paint');
      }
    }

    function activarPincel() {
      const img = document.getElementById('imageToEdit');
      const wrapper = document.getElementById('editorWrapper');
      paintCanvas = document.getElementById('paintCanvas');

      const rectImg = img.getBoundingClientRect();
      const rectWrapper = wrapper.getBoundingClientRect();

      paintCanvas.style.left = (rectImg.left - rectWrapper.left) + "px";
      paintCanvas.style.top = (rectImg.top - rectWrapper.top) + "px";
      paintCanvas.style.width = rectImg.width + "px";
      paintCanvas.style.height = rectImg.height + "px";

      paintCanvas.width = img.naturalWidth;
      paintCanvas.height = img.naturalHeight;

      paintCanvas.style.display = "block";
      paintCtx = paintCanvas.getContext('2d');
      paintCtx.lineCap = 'round';
      paintCtx.lineJoin = 'round';

      paintCanvas.onmousedown = empezar;
      paintCanvas.onmousemove = mover;
      paintCanvas.onmouseup = parar;

      paintCanvas.ontouchstart = (e) => empezar(e.touches[0]);
      paintCanvas.ontouchmove = (e) => { e.preventDefault(); mover(e.touches[0]); };
      paintCanvas.ontouchend = parar;
      
      historyStack = [];
      guardarPaso();
    }

    function getPos(e) {
      const rect = paintCanvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (paintCanvas.width / rect.width),
        y: (e.clientY - rect.top) * (paintCanvas.height / rect.height)
      };
    }

    function empezar(e) {
      isDrawing = true;
      const p = getPos(e);
      paintCtx.beginPath();
      paintCtx.fillStyle = document.getElementById('brushColor').value;
      paintCtx.arc(p.x, p.y, document.getElementById('brushSize').value / 2, 0, Math.PI * 2);
      paintCtx.fill();
      paintCtx.beginPath();
      paintCtx.moveTo(p.x, p.y);
    }

    function mover(e) {
      if (!isDrawing) return;
      const p = getPos(e);
      paintCtx.strokeStyle = document.getElementById('brushColor').value;
      paintCtx.lineWidth = document.getElementById('brushSize').value;
      paintCtx.lineTo(p.x, p.y);
      paintCtx.stroke();
    }

    function parar() {
      if (isDrawing) {
        paintCtx.closePath();
        isDrawing = false;
        guardarPaso();
      }
    }

    function guardarPaso() {
      if (paintCtx) historyStack.push(paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height));
    }

    function deshacer() {
      if (historyStack.length > 1) {
        historyStack.pop();
        paintCtx.putImageData(historyStack[historyStack.length - 1], 0, 0);
      }
    }

    function cerrarEditor() {
      if (cropper) { cropper.destroy(); cropper = null; }
      document.getElementById('editorModal').style.display = "none";
    }

    async function guardarImagen() {
      const btn = document.getElementById('btnSave');
      btn.innerText = "Guardando...";
      btn.disabled = true;

      try {
        const img = document.getElementById('imageToEdit');
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = img.naturalWidth;
        finalCanvas.height = img.naturalHeight;
        const ctx = finalCanvas.getContext('2d');

        ctx.drawImage(img, 0, 0);

        if (paintCanvas && paintCanvas.style.display !== 'none') {
          ctx.drawImage(paintCanvas, 0, 0);
        }

        const blob = await new Promise(res => finalCanvas.toBlob(res, 'image/jpeg', 0.95));
        const formData = new FormData();
        formData.append("image", blob, "pixelart.jpg");

        const uploadRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        const uploadData = await uploadRes.json();

        if (uploadData.success) {
          galeriaActual[indiceEnEdicion].url = uploadData.data.url;
          await guardarGaleriaNube(galeriaActual);
          cerrarEditor();
        }
      } catch (e) {
        alert("Error al guardar la edición.");
      } finally {
        btn.innerText = "Guardar Cambios";
        btn.disabled = false;
      }
    }

    document.addEventListener("DOMContentLoaded", cargarGaleria);
  </script>
</body>
</html>
