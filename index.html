<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Pixel Art</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { color: #3b82f6; }
    .card-form {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      text-align: center;
    }
    input[type="text"] {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
    }
    .btn-upload {
      background-color: #359bf0;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    .btn-upload:hover { background-color: #2580d0; }
    #statusMsg { margin-top: 15px; font-size: 0.9em; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 800px;
      margin-top: 30px;
    }
    .gallery-card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .gallery-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: #000;
      border-radius: 6px;
    }
    .gallery-card h3 {
      font-size: 1rem;
      margin: 10px 0 0 0;
    }
  </style>
</head>
<body>

  <h1>Galería de Pixel Art</h1>

  <div class="card-form">
    <h2>Subir nuevo dibujo</h2>
    <input type="text" id="nameInput" placeholder="Nombre del personaje / dibujo">
    
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="subirImagen()">
    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
      📷 Seleccionar de la Galería
    </button>

    <div id="statusMsg"></div>
  </div>

  <div class="gallery-grid" id="galleryGrid"></div>

  <script>
    const API_KEY = "9fc58ee8b707046ece9681fa65e39604";

    async function subirImagen() {
      const nameInput = document.getElementById('nameInput');
      const fileInput = document.getElementById('fileInput');
      const statusMsg = document.getElementById('statusMsg');

      if (!fileInput.files[0]) return;

      const title = nameInput.value.trim() || "Sin título";
      const file = fileInput.files[0];

      statusMsg.innerText = "Subiendo imagen...";
      statusMsg.style.color = "#3b82f6";

      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          const imageUrl = data.data.url;

          // Guardar imagen subida
          const savedArt = JSON.parse(localStorage.getItem('pixelArtGallery') || '[]');
          savedArt.unshift({ title: title, url: imageUrl });
          localStorage.setItem('pixelArtGallery', JSON.stringify(savedArt));

          nameInput.value = '';
          fileInput.value = '';
          statusMsg.innerText = "¡Imagen subida con éxito!";
          statusMsg.style.color = "#00d26a";

          cargarGaleria();
        } else {
          statusMsg.innerText = "Error al subir la imagen.";
          statusMsg.style.color = "#ff4d4d";
        }
      } catch (error) {
        console.error(error);
        statusMsg.innerText = "Error de conexión.";
        statusMsg.style.color = "#ff4d4d";
      }
    }

    function cargarGaleria() {
      const galleryGrid = document.getElementById('galleryGrid');
      const savedArt = JSON.parse(localStorage.getItem('pixelArtGallery') || '[]');
      galleryGrid.innerHTML = '';

      savedArt.forEach(item => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        card.innerHTML = `
          <img src="${item.url}" alt="${item.title}">
          <h3>${item.title}</h3>
        `;
        galleryGrid.appendChild(card);
      });
    }

    document.addEventListener("DOMContentLoaded", cargarGaleria);
  </script>
</body>
</html>
