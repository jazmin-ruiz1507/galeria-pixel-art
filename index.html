<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Pixel Art</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    
    /* Barra superior para Admin */
    .admin-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .btn-admin-toggle {
      background: transparent;
      border: 1px solid #444;
      color: #aaa;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8em;
    }
    .btn-admin-toggle:hover {
      border-color: #3b82f6;
      color: #fff;
    }

    h1 { color: #3b82f6; margin-top: 0; }
    
    /* Formulario de Subida (Oculto por defecto) */
    .card-form {
      display: none; /* 👈 Se oculta hasta activar el modo admin */
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      text-align: center;
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
    }
    .btn-upload {
      background-color: #359bf0;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    .btn-upload:hover { background-color: #2580d0; }
    #statusMsg { margin-top: 15px; font-size: 0.9em; }

    /* Galería */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 800px;
      margin-top: 20px;
    }
    .gallery-card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #2a2a2a;
    }
    .gallery-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: #000;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .gallery-card img:hover {
      transform: scale(1.02);
    }
    .gallery-card h3 {
      font-size: 1rem;
      margin: 12px 0;
      word-break: break-word;
    }

    /* Botones Minimalistas Oscuros */
    .card-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .btn-action {
      background-color: #262626;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: 500;
      color: #e5e5e5;
      transition: all 0.2s ease;
    }
    .btn-edit { border: 1px solid #3b82f6; }
    .btn-edit:hover { background-color: #3b82f6; color: #ffffff; }
    .btn-delete { border: 1px solid #ef4444; }
    .btn-delete:hover { background-color: #ef4444; color: #ffffff; }

    /* Modal Visor de Imagen Grande */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .modal img {
      max-width: 90%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
    }
    .modal-caption { margin-top: 15px; font-size: 1.2rem; color: #fff; }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 30px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="admin-bar">
    <button class="btn-admin-toggle" onclick="toggleAdminMode()" id="adminBtn">🔐 Modo Admin</button>
  </div>

  <h1>Galería de Pixel Art</h1>

  <!-- El panel para subir se muestra únicamente si eres Admin -->
  <div class="card-form" id="uploadForm">
    <h2>Subir nuevo dibujo</h2>
    <input type="text" id="nameInput" placeholder="Nombre del personaje / dibujo">
    
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="subirImagen()">
    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
      📷 Seleccionar de la Galería
    </button>

    <div id="statusMsg"></div>
  </div>

  <div class="gallery-grid" id="galleryGrid"></div>

  <!-- Modal / Zoom de imagen -->
  <div id="imageModal" class="modal" onclick="cerrarModal()">
    <span class="modal-close">&times;</span>
    <img id="modalImg" src="" alt="Imagen ampliada">
    <div id="modalCaption" class="modal-caption"></div>
  </div>

  <script>
    const API_KEY = "9fc58ee8b707046ece9681fa65e39604";
    const ADMIN_PIN = "1234"; // 👈 Tu clave secreta
    let isAdmin = false;

    function toggleAdminMode() {
      const uploadForm = document.getElementById('uploadForm');

      if (isAdmin) {
        isAdmin = false;
        document.getElementById('adminBtn').innerText = "🔐 Modo Admin";
        uploadForm.style.display = "none";
        alert("Modo Admin desactivado.");
      } else {
        const pass = prompt("Ingresa la clave de administrador:");
        if (pass === ADMIN_PIN) {
          isAdmin = true;
          document.getElementById('adminBtn').innerText = "🔓 Salir de Modo Admin";
          uploadForm.style.display = "block";
          alert("¡Modo Admin activado!");
        } else if (pass !== null) {
          alert("Clave incorrecta.");
        }
      }
      cargarGaleria();
    }

    async function subirImagen() {
      if (!isAdmin) return;
      const nameInput = document.getElementById('nameInput');
      const fileInput = document.getElementById('fileInput');
      const statusMsg = document.getElementById('statusMsg');

      if (!fileInput.files[0]) return;

      const title = nameInput.value.trim() || "Sin título";
      const file = fileInput.files[0];

      statusMsg.innerText = "Subiendo imagen...";
      statusMsg.style.color = "#3b82f6";

      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          const imageUrl = data.data.url;

          const savedArt = JSON.parse(localStorage.getItem('pixelArtGallery') || '[]');
          savedArt.unshift({ id: Date.now(), title: title, url: imageUrl });
          localStorage.setItem('pixelArtGallery', JSON.stringify(savedArt));

          nameInput.value = '';
          fileInput.value = '';
          statusMsg.innerText = "¡Imagen subida con éxito!";
          statusMsg.style.color = "#00d26a";

          cargarGaleria();
        } else {
          statusMsg.innerText = "Error al subir la imagen.";
          statusMsg.style.color = "#ff4d4d";
        }
      } catch (error) {
        console.error(error);
        statusMsg.innerText = "Error de conexión.";
        statusMsg.style.color = "#ff4d4d";
      }
    }

    function cargarGaleria() {
      const galleryGrid = document.getElementById('galleryGrid');
      const savedArt = JSON.parse(localStorage.getItem('pixelArtGallery') || '[]');
      galleryGrid.innerHTML = '';

      savedArt.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        
        const actionButtons = isAdmin ? `
          <div class="card-actions">
            <button class="btn-action btn-edit" onclick="editarTitulo(${index})">✏️ Editar</button>
            <button class="btn-action btn-delete" onclick="eliminarImagen(${index})">🗑️ Eliminar</button>
          </div>
        ` : '';

        card.innerHTML = `
          <img src="${item.url}" alt="${item.title}" onclick="abrirModal('${item.url}', '${item.title}')">
          <h3>${item.title}</h3>
          ${actionButtons}
        `;
        galleryGrid.appendChild(card);
      });
    }

    function editarTitulo(index) {
      if (!isAdmin) return;
      const savedArt = JSON.parse(localStorage.getItem('pixelArtGallery') || '[]');
      const nuevoTitulo = prompt("Edita el nombre del dibujo:", savedArt[index].title);
      
      if (nuevoTitulo !== null && nuevoTitulo.trim() !== "") {
        savedArt[index].title = nuevoTitulo.trim();
        localStorage.setItem('pixelArtGallery', JSON.stringify(savedArt));
        cargarGaleria();
      }
    }

    function eliminarImagen(index) {
      if (!isAdmin) return;
      if (confirm("¿Seguro que quieres eliminar esta imagen?")) {
        const savedArt = JSON.parse(localStorage.getItem('pixelArtGallery') || '[]');
        savedArt.splice(index, 1);
        localStorage.setItem('pixelArtGallery', JSON.stringify(savedArt));
        cargarGaleria();
      }
    }

    function abrirModal(url, title) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      const modalCaption = document.getElementById('modalCaption');
      
      modal.style.display = "flex";
      modalImg.src = url;
      modalCaption.innerText = title;
    }

    function cerrarModal() {
      document.getElementById('imageModal').style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", cargarGaleria);
  </script>
</body>
</html>
