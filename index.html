<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Pixel Art</title>
  
  <!-- Estilos e librería de Cropper.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      margin: 0;
    }
    
    .admin-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .btn-admin-toggle {
      background: transparent;
      border: 1px solid #444;
      color: #aaa;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8em;
    }
    .btn-admin-toggle:hover { border-color: #3b82f6; color: #fff; }

    h1 { color: #3b82f6; margin-top: 0; font-size: 1.6rem; }
    
    .card-form {
      display: none;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      text-align: center;
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
    }
    .btn-upload {
      background-color: #359bf0;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    .btn-upload:hover { background-color: #2580d0; }
    #statusMsg { margin-top: 15px; font-size: 0.9em; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin-top: 15px;
      box-sizing: border-box;
    }
    .gallery-card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #2a2a2a;
      box-sizing: border-box;
    }
    .gallery-card img {
      width: 100%;
      height: 140px;
      object-fit: contain;
      background: #000;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .gallery-card img:hover { transform: scale(1.02); }
    .gallery-card h3 {
      font-size: 0.9rem;
      margin: 8px 0;
      word-break: break-word;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
    }
    .btn-action {
      background-color: #262626;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75em;
      font-weight: 500;
      color: #e5e5e5;
      transition: all 0.2s ease;
      border: 1px solid #444;
    }
    .btn-edit { border-color: #3b82f6; }
    .btn-edit:hover { background-color: #3b82f6; color: #ffffff; }
    .btn-crop { border-color: #eab308; }
    .btn-crop:hover { background-color: #eab308; color: #000; }
    .btn-delete { border-color: #ef4444; }
    .btn-delete:hover { background-color: #ef4444; color: #ffffff; }

    /* --- MODAL PANTALLA COMPLETA --- */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 0;
      margin: 0;
    }
    .modal img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      border-radius: 0;
    }
    .modal-caption {
      position: absolute;
      bottom: 25px;
      font-size: 1.1rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 35px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      z-index: 101;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }

    /* --- MODAL EDITOR DE IMAGEN Y EMOJIS --- */
    .editor-modal {
      display: none;
      position: fixed;
      z-index: 200;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #121212;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 15px;
    }
    .editor-container {
      position: relative;
      width: 100%;
      height: 52vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .editor-container img {
      max-width: 100%;
      max-height: 100%;
    }

    .emoji-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      font-size: 2.5rem;
      cursor: move;
      user-select: none;
      touch-action: none;
      z-index: 210;
      transform: translate(-50%, -50%);
    }

    .editor-controls {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }

    /* Paleta de Emojis y Botones Rediseñados */
    .emoji-palette {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #1e1e1e;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      flex-wrap: wrap;
    }
    .emoji-btn {
      font-size: 1.4rem;
      background: #2a2a2a;
      border: 1px solid #3d3d3d;
      border-radius: 8px;
      cursor: pointer;
      padding: 6px 10px;
      transition: all 0.2s ease;
    }
    .emoji-btn:hover { background: #383838; transform: scale(1.05); }

    .btn-emoji-done {
      background: #00d26a;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-emoji-done:hover { background: #00b85c; }

    .btn-emoji-clear {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .btn-emoji-clear:hover {
      background: #ef4444;
      color: #ffffff;
    }

    .editor-controls label { font-size: 0.85rem; color: #ccc; }
    .editor-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn-editor-save {
      background: #3b82f6;
      border: none;
      color: #ffffff;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      flex: 1;
      font-size: 0.95rem;
    }
    .btn-editor-save:hover { background: #2563eb; }
    .btn-editor-cancel {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      flex: 1;
      font-size: 0.95rem;
    }
    .btn-editor-cancel:hover { background: #3d3d3d; }
  </style>
</head>
<body>

  <div class="admin-bar">
    <button class="btn-admin-toggle" onclick="toggleAdminMode()" id="adminBtn">🔐 Modo Admin</button>
  </div>

  <h1>Galería de Pixel Art</h1>

  <div class="card-form" id="uploadForm">
    <h2>Subir nuevo dibujo</h2>
    <input type="text" id="nameInput" placeholder="Nombre del personaje / dibujo">
    
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;" onchange="subirImagen()">
    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
      📷 Tomar Foto / Seleccionar
    </button>

    <div id="statusMsg"></div>
  </div>

  <div class="gallery-grid" id="galleryGrid">Cargando galería...</div>

  <!-- Modal Ver Imagen -->
  <div id="imageModal" class="modal" onclick="cerrarModal()">
    <span class="modal-close">&times;</span>
    <img id="modalImg" src="" alt="Imagen ampliada">
    <div id="modalCaption" class="modal-caption"></div>
  </div>

  <!-- Modal Editor de Imagen y Emojis -->
  <div id="editorModal" class="editor-modal">
    <h3 style="margin: 5px 0;">Editar Imagen & Tapar Firma</h3>
    <div class="editor-container" id="editorContainer">
      <img id="imageToEdit" src="" alt="Editar">
      <div id="activeEmoji" class="emoji-overlay" style="display:none;">🖤</div>
    </div>
    
    <div class="editor-controls">
      <div>
        <label style="display:block; margin-bottom: 6px;">Selecciona un emoji para cubrir detalles:</label>
        <div class="emoji-palette">
          <button class="emoji-btn" onclick="colocarEmoji('🖤')">🖤</button>
          <button class="emoji-btn" onclick="colocarEmoji('🌸')">🌸</button>
          <button class="emoji-btn" onclick="colocarEmoji('✨')">✨</button>
          <button class="emoji-btn" onclick="colocarEmoji('👑')">👑</button>
          
          <button class="btn-emoji-done" onclick="fijarEmoji()">✓ Listo</button>
          <button class="btn-emoji-clear" onclick="quitarEmoji()">🗑️ Limpiar</button>
        </div>
      </div>

      <label>Brillo: <span id="brightnessVal">100%</span></label>
      <input type="range" id="brightnessRange" min="50" max="200" value="100" oninput="ajustarBrillo(this.value)">
      
      <div class="editor-btns">
        <button class="btn-editor-cancel" onclick="cerrarEditor()">Cancelar</button>
        <button class="btn-editor-save" id="btnSaveEdit" onclick="guardarEdicion()">Guardar Imagen</button>
      </div>
    </div>
  </div>

  <script>
    const IMGBB_API_KEY = "9fc58ee8b707046ece9681fa65e39604";
    const JSONBIN_BIN_ID = "6a7297f9f5f4af5e29ec52c2";
    const JSONBIN_MASTER_KEY = "$2a$10$vygQg5yM2D./HgSdwYY3FurZQV/dUU5iTNvDzdDmi7eQRyVSaA6Fe";
    const ADMIN_PIN = "1234";

    let isAdmin = false;
    let galeriaActual = [];
    let cropper = null;
    let indiceEnEdicion = -1;
    let valorBrilloActual = 100;
    let emojiSeleccionado = null;

    async function obtenerGaleriaNube() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
        });
        const data = await res.json();
        
        let datos = data.record || [];
        if (Array.isArray(datos)) {
          galeriaActual = datos.filter(item => item.url && !item.url.includes("sample.jpg"));
        } else {
          galeriaActual = [];
        }

        cargarGaleriaUI();
      } catch (err) {
        console.error("Error al obtener datos:", err);
        document.getElementById('galleryGrid').innerText = "Error al cargar la galería.";
      }
    }

    async function guardarGaleriaNube(nuevaGaleria) {
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": JSONBIN_MASTER_KEY
          },
          body: JSON.stringify(nuevaGaleria)
        });
        galeriaActual = nuevaGaleria;
        cargarGaleriaUI();
      } catch (err) {
        console.error("Error al guardar datos:", err);
      }
    }

    function toggleAdminMode() {
      const uploadForm = document.getElementById('uploadForm');
      if (isAdmin) {
        isAdmin = false;
        document.getElementById('adminBtn').innerText = "🔐 Modo Admin";
        uploadForm.style.display = "none";
      } else {
        const pass = prompt("Ingresa la clave de administrador:");
        if (pass === ADMIN_PIN) {
          isAdmin = true;
          document.getElementById('adminBtn').innerText = "🔓 Salir de Modo Admin";
          uploadForm.style.display = "block";
        } else if (pass !== null) {
          alert("Clave incorrecta.");
        }
      }
      cargarGaleriaUI();
    }

    async function subirImagen() {
      if (!isAdmin) return;
      const nameInput = document.getElementById('nameInput');
      const fileInput = document.getElementById('fileInput');
      const statusMsg = document.getElementById('statusMsg');

      if (!fileInput.files[0]) return;

      const title = nameInput.value.trim() || "Sin título";
      const file = fileInput.files[0];

      statusMsg.innerText = "Subiendo imagen...";
      statusMsg.style.color = "#3b82f6";

      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          const imageUrl = data.data.url;
          const nuevaLista = [{ id: Date.now(), title: title, url: imageUrl }, ...galeriaActual];
          
          await guardarGaleriaNube(nuevaLista);

          nameInput.value = '';
          fileInput.value = '';
          statusMsg.innerText = "¡Imagen guardada en la nube!";
          statusMsg.style.color = "#00d26a";
        } else {
          statusMsg.innerText = "Error al subir la imagen.";
          statusMsg.style.color = "#ff4d4d";
        }
      } catch (error) {
        console.error(error);
        statusMsg.innerText = "Error de conexión.";
        statusMsg.style.color = "#ff4d4d";
      }
    }

    function cargarGaleriaUI() {
      const galleryGrid = document.getElementById('galleryGrid');
      galleryGrid.innerHTML = '';

      if (galeriaActual.length === 0) {
        galleryGrid.innerHTML = '<p style="grid-column: 1/-1; color: #888;">No hay imágenes cargadas aún.</p>';
        return;
      }

      galeriaActual.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        
        const actionButtons = isAdmin ? `
          <div class="card-actions">
            <button class="btn-action btn-edit" onclick="editarTitulo(${index})">✏️ Renombrar</button>
            <button class="btn-action btn-crop" onclick="abrirEditor(${index})">✂️ Editar/Tapar Firma</button>
            <button class="btn-action btn-delete" onclick="eliminarImagen(${index})">🗑️ Eliminar</button>
          </div>
        ` : '';

        card.innerHTML = `
          <img src="${item.url}" alt="${item.title}" onclick="abrirModal('${item.url}', '${item.title}')">
          <h3>${item.title}</h3>
          ${actionButtons}
        `;
        galleryGrid.appendChild(card);
      });
    }

    /* --- EDITOR DE IMAGEN Y TAPADO DE FIRMA --- */
    function abrirEditor(index) {
      if (!isAdmin) return;
      indiceEnEdicion = index;
      const item = galeriaActual[index];
      
      const imageToEdit = document.getElementById('imageToEdit');
      imageToEdit.src = item.url;
      imageToEdit.crossOrigin = "anonymous";

      document.getElementById('brightnessRange').value = 100;
      document.getElementById('brightnessVal').innerText = "100%";
      valorBrilloActual = 100;
      quitarEmoji();

      document.getElementById('editorModal').style.display = "flex";

      if (cropper) { cropper.destroy(); }
      cropper = new Cropper(imageToEdit, {
        viewMode: 1,
        autoCropArea: 0.9,
      });
    }

    function colocarEmoji(char) {
      const el = document.getElementById('activeEmoji');
      el.innerText = char;
      el.style.display = 'block';
      el.style.border = '1px dashed #00d26a';
      emojiSeleccionado = char;
      hacerArrastrable(el);
    }

    function fijarEmoji() {
      const el = document.getElementById('activeEmoji');
      if (emojiSeleccionado) {
        el.style.border = 'none';
        alert("Emoji fijado en esta posición.");
      }
    }

    function quitarEmoji() {
      const el = document.getElementById('activeEmoji');
      el.style.display = 'none';
      el.style.border = 'none';
      emojiSeleccionado = null;
    }

    function hacerArrastrable(el) {
      let posX = 0, posY = 0, mouseX = 0, mouseY = 0;
      
      el.onpointerdown = dragMouseDown;

      function dragMouseDown(e) {
        e.preventDefault();
        mouseX = e.clientX;
        mouseY = e.clientY;
        document.onpointermove = elementDrag;
        document.onpointerup = closeDragElement;
      }

      function elementDrag(e) {
        e.preventDefault();
        posX = mouseX - e.clientX;
        posY = mouseY - e.clientY;
        mouseX = e.clientX;
        mouseY = e.clientY;
        el.style.top = (el.offsetTop - posY) + "px";
        el.style.left = (el.offsetLeft - posX) + "px";
      }

      function closeDragElement() {
        document.onpointermove = null;
        document.onpointerup = null;
      }
    }

    function ajustarBrillo(val) {
      valorBrilloActual = val;
      document.getElementById('brightnessVal').innerText = val + "%";
      const container = document.querySelector('.cropper-container');
      if (container) {
        container.style.filter = `brightness(${val}%)`;
      }
    }

    function cerrarEditor() {
      if (cropper) { cropper.destroy(); cropper = null; }
      document.getElementById('editorModal').style.display = "none";
      indiceEnEdicion = -1;
    }

    async function guardarEdicion() {
      if (!cropper || indiceEnEdicion === -1) return;

      const btnSave = document.getElementById('btnSaveEdit');
      btnSave.innerText = "Guardando...";
      btnSave.disabled = true;

      const croppedCanvas = cropper.getCroppedCanvas();
      
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = croppedCanvas.width;
      finalCanvas.height = croppedCanvas.height;
      const ctx = finalCanvas.getContext('2d');
      
      ctx.filter = `brightness(${valorBrilloActual}%)`;
      ctx.drawImage(croppedCanvas, 0, 0);

      const activeEmoji = document.getElementById('activeEmoji');
      if (emojiSeleccionado && activeEmoji.style.display !== 'none') {
        const containerRect = document.getElementById('editorContainer').getBoundingClientRect();
        const emojiRect = activeEmoji.getBoundingClientRect();

        const relativeX = (emojiRect.left - containerRect.left) / containerRect.width;
        const relativeY = (emojiRect.top - containerRect.top) / containerRect.height;

        ctx.filter = 'none';
        ctx.font = `${finalCanvas.width * 0.12}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emojiSeleccionado, finalCanvas.width * relativeX, finalCanvas.height * relativeY);
      }

      finalCanvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append("image", blob, "edited_image.png");

        try {
          const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: "POST",
            body: formData
          });

          const data = await res.json();
          if (data.success) {
            const nuevaUrl = data.data.url;
            const copia = [...galeriaActual];
            copia[indiceEnEdicion].url = nuevaUrl;

            await guardarGaleriaNube(copia);
            cerrarEditor();
          } else {
            alert("Error al guardar la nueva imagen.");
          }
        } catch (err) {
          console.error(err);
          alert("Error de conexión al guardar.");
        } finally {
          btnSave.innerText = "Guardar Imagen";
          btnSave.disabled = false;
        }
      }, 'image/png');
    }

    async function editarTitulo(index) {
      if (!isAdmin) return;
      const nuevoTitulo = prompt("Edita el nombre del dibujo:", galeriaActual[index].title);
      
      if (nuevoTitulo !== null && nuevoTitulo.trim() !== "") {
        const copia = [...galeriaActual];
        copia[index].title = nuevoTitulo.trim();
        await guardarGaleriaNube(copia);
      }
    }

    async function eliminarImagen(index) {
      if (!isAdmin) return;
      if (confirm("¿Seguro que quieres eliminar esta imagen?")) {
        const copia = [...galeriaActual];
        copia.splice(index, 1);
        await guardarGaleriaNube(copia);
      }
    }

    function abrirModal(url, title) {
      const modal = document.getElementById('imageModal');
      document.getElementById('modalImg').src = url;
      document.getElementById('modalCaption').innerText = title;
      modal.style.display = "flex";
    }

    function cerrarModal() {
      document.getElementById('imageModal').style.display = "none";
    }

    document.addEventListener("DOMContentLoaded", obtenerGaleriaNube);
  </script>
</body>
</html>
